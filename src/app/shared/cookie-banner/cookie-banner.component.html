@if (showBanner) {
  <div class="cookie-banner" role="alert" aria-label="隱私通知">
    <p style="
      font-size: 0.85rem;
      color: var(--text-primary);
      line-height: 1.7;
      margin: 0 0 16px;
    ">
      本網站使用 Cookie 以提升瀏覽體驗，並透過 <strong>Google AdSense</strong> 等第三方廣告服務投放個人化廣告。這些服務可能使用 Cookie 記錄您的瀏覽行為。繼續使用即表示您同意我們的
      <a routerLink="/privacy/" style="color: #e879a0; text-decoration: none;">隱私權政策</a>
      及
      <a routerLink="/terms/" style="color: #e879a0; text-decoration: none;">使用條款</a>。
    </p>
    <button
      (click)="accept()"
      style="
        background: linear-gradient(135deg, #e879a0, #c84a87);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 24px;
        font-size: 0.85rem;
        font-family: 'JF Openhuninn', sans-serif;
        cursor: pointer;
        width: 100%;
        letter-spacing: 0.05em;
      "
    >我了解，繼續瀏覽</button>
  </div>
}
