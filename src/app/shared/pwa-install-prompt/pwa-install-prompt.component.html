@if (visible()) {
  <div class="pwa-backdrop" (click)="dismiss()" aria-hidden="true"></div>

  <div class="pwa-sheet" role="dialog" aria-modal="true" aria-labelledby="pwa-title">

    <!-- Close -->
    <button #closeBtn class="pwa-close" (click)="dismiss()" aria-label="關閉">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <line x1="1" y1="1" x2="13" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="13" y1="1" x2="1" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- App icon + heading -->
    <div class="pwa-header">
      <div class="pwa-icon" aria-hidden="true">
        <img src="/icons/icon-192x192.png" alt="" width="52" height="52" />
      </div>
      <div>
        <p id="pwa-title" class="pwa-title">加到主畫面</p>
        <p class="pwa-subtitle">像 App 一樣快速開啟</p>
      </div>
    </div>

    <!-- Steps for iOS -->
    @if (mode() === 'ios') {
      <ol class="pwa-steps">
        <li>
          <span class="step-badge">1</span>
          點下方的
          <span class="step-inline-icon" aria-label="分享">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
              <polyline points="16 6 12 2 8 6"/>
              <line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
          </span>
          分享按鈕
        </li>
        <li>
          <span class="step-badge">2</span>
          選擇「加入主畫面」
          <span class="step-inline-icon" aria-label="加入主畫面">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <path d="M17 14v6M14 17h6"/>
            </svg>
          </span>
        </li>
        <li>
          <span class="step-badge">3</span>
          點右上角「新增」完成
        </li>
      </ol>
    }

    <!-- Android one-tap install -->
    @if (mode() === 'android') {
      <p class="pwa-android-hint">
        一鍵安裝，離線也能使用，不占 App Store 空間
      </p>
      <button
        class="pwa-install-btn"
        [class.pwa-install-btn--loading]="installing()"
        [disabled]="installing()"
        (click)="install()"
      >
        @if (installing()) {
          <span class="pwa-spinner" aria-hidden="true"></span>
          安裝中…
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          加入主畫面
        }
      </button>
    }

    <!-- Footer: dismiss checkbox -->
    <label class="pwa-dismiss-label">
      <input type="checkbox" class="pwa-checkbox" [(ngModel)]="dismissToday" />
      <span class="pwa-checkbox-box" aria-hidden="true">
        @if (dismissToday) {
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
            <polyline points="1.5,5 4,7.5 8.5,2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        }
      </span>
      <span>今日不再顯示</span>
    </label>
  </div>
}
