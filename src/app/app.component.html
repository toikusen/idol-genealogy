<a href="#main-content" class="skip-link">跳到主內容</a>

<!-- Global ambient background — single instance across all pages -->
<div class="global-ambient-bg" aria-hidden="true"></div>

<router-outlet />

@if ((session$ | async); as session) {
  @if (!isAdminRoute) {
    <div style="
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(232,121,160,0.2);
      border-radius: 20px;
      box-shadow: 0 2px 10px rgba(45,27,46,0.08);
      font-size: 0.7rem;
      font-family: 'JF Openhuninn', sans-serif;
      overflow: hidden;
    ">
      <a routerLink="/my-contributions/" style="
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px 6px 10px;
        color: var(--text-faint-75);
        text-decoration: none;
        letter-spacing: 0.05em;
        cursor: pointer;
      ">
        <span style="width:6px;height:6px;border-radius:50%;background:#86efac;flex-shrink:0;"></span>
        {{ session.user.user_metadata['display_name'] || '我的貢獻' }}
      </a>
      <button (click)="signOut()" style="
        display: inline-flex;
        align-items: center;
        padding: 8px 14px 8px 10px;
        min-height: 44px;
        border: none;
        border-left: 1px solid rgba(232,121,160,0.15);
        background: transparent;
        font-size: 0.65rem;
        font-family: 'JF Openhuninn', sans-serif;
        color: var(--text-faint-45);
        cursor: pointer;
        letter-spacing: 0.04em;
      ">登出</button>
    </div>
  }
}

@if ((isAdmin$ | async) && !isAdminRoute) {
  <a
    routerLink="/admin"
    style="
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px 7px 10px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(232,121,160,0.25);
      border-radius: 20px;
      box-shadow: 0 2px 12px rgba(45,27,46,0.1);
      font-size: 0.75rem;
      font-family: 'JF Openhuninn', sans-serif;
      letter-spacing: 0.06em;
      color: var(--text-faint-85);
      text-decoration: none;
      transition: box-shadow 0.2s, background 0.2s;
    "
  >
    <!-- Grid icon -->
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
      <rect x="1" y="1" width="5.5" height="5.5" rx="1" fill="rgba(232,121,160,0.7)"/>
      <rect x="9.5" y="1" width="5.5" height="5.5" rx="1" fill="rgba(232,121,160,0.4)"/>
      <rect x="1" y="9.5" width="5.5" height="5.5" rx="1" fill="rgba(232,121,160,0.4)"/>
      <rect x="9.5" y="9.5" width="5.5" height="5.5" rx="1" fill="rgba(232,121,160,0.7)"/>
    </svg>
    後台管理
  </a>
}

<app-cookie-banner />
