<div class="login-bg flex items-center justify-center relative overflow-hidden" style="
  background: #fdf6fb;
  position: fixed;
  inset: 0;
  z-index: 200;
  overflow-y: auto;
">

  <!-- Login ambient background -->
  <div style="
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 70% 60% at 50% 0%, rgba(232,121,160,0.12) 0%, transparent 70%);
  "></div>

  <!-- Grain overlay -->
  <div style="
    position: absolute; inset: 0; pointer-events: none; opacity: 0.025;
    background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%221.1%22 numOctaves=%224%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/%3E%3C/svg%3E');
    background-size: 180px;
  "></div>

  <!-- Decorative vertical rule left -->
  <div style="
    position: absolute; left: 48px; top: 50%; transform: translateY(-50%);
    width: 1px; height: 220px;
    background: linear-gradient(to bottom, transparent, rgba(232,121,160,0.25), rgba(124,108,242,0.15), transparent);
  "></div>

  <!-- Decorative vertical rule right -->
  <div style="
    position: absolute; right: 48px; top: 50%; transform: translateY(-50%);
    width: 1px; height: 220px;
    background: linear-gradient(to bottom, transparent, rgba(124,108,242,0.15), rgba(232,121,160,0.25), transparent);
  "></div>

  <!-- Corner marks -->
  <div style="position: absolute; top: 36px; left: 36px; width: 20px; height: 20px; border-top: 1px solid rgba(232,121,160,0.35); border-left: 1px solid rgba(232,121,160,0.35);"></div>
  <div style="position: absolute; top: 36px; right: 36px; width: 20px; height: 20px; border-top: 1px solid rgba(232,121,160,0.35); border-right: 1px solid rgba(232,121,160,0.35);"></div>
  <div style="position: absolute; bottom: 36px; left: 36px; width: 20px; height: 20px; border-bottom: 1px solid rgba(124,108,242,0.3); border-left: 1px solid rgba(124,108,242,0.3);"></div>
  <div style="position: absolute; bottom: 36px; right: 36px; width: 20px; height: 20px; border-bottom: 1px solid rgba(124,108,242,0.3); border-right: 1px solid rgba(124,108,242,0.3);"></div>


  <!-- Main login card -->
  <div class="login-card" style="
    position: relative; z-index: 10;
    width: 100%; max-width: 440px;
    padding: 64px 56px 56px;
    background: rgba(255,255,255,0.94);
    border: 1px solid rgba(232,121,160,0.15);
    border-radius: 4px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 24px 64px rgba(45,27,46,0.07),
      0 4px 16px rgba(232,121,160,0.06);
  ">

    <!-- Top accent line -->
    <div style="
      position: absolute; top: 0; left: 56px; right: 56px; height: 2px;
      background: linear-gradient(to right, transparent, rgba(232,121,160,0.6), rgba(124,108,242,0.5), transparent);
      border-radius: 0 0 2px 2px;
    "></div>

    <!-- Primary title -->
    <div style="text-align: center; margin-bottom: 8px;">
      <h1 style="
        font-size: 2.6rem; font-weight: 300; line-height: 1.1;
        letter-spacing: 0.04em; color: var(--text-primary);
        margin: 0;
      ">Idol Maps</h1>
    </div>

    <!-- Japanese subtitle -->
    <div style="text-align: center; margin-bottom: 6px;">
      <span style="
        font-size: 0.85rem; color: var(--text-faint-70);
        letter-spacing: 0.18em;
      ">偶像地圖</span>
    </div>

    <!-- Decorative triple line divider -->
    <div style="
      display: flex; align-items: center; justify-content: center;
      gap: 6px; margin: 28px 0 32px;
    ">
      <div style="width: 40px; height: 1px; background: linear-gradient(to right, transparent, rgba(232,121,160,0.4));"></div>
      <div style="width: 5px; height: 5px; border-radius: 50%; background: rgba(232,121,160,0.35);"></div>
      <div style="width: 5px; height: 5px; border-radius: 50%; background: rgba(232,121,160,0.2);"></div>
      <div style="width: 5px; height: 5px; border-radius: 50%; background: rgba(232,121,160,0.35);"></div>
      <div style="width: 40px; height: 1px; background: linear-gradient(to left, transparent, rgba(232,121,160,0.4));"></div>
    </div>

    <!-- Context label -->
    <div style="text-align: center; margin-bottom: 24px;">
      <p style="
        font-size: 0.78rem; color: var(--text-faint-55);
        letter-spacing: 0.2em; text-transform: uppercase; margin: 0;
      ">管理者登入 · Curator Access</p>
    </div>

    <!-- Google sign-in button -->
    <button
      type="button"
      (click)="signIn()"
      class="google-signin-btn"
    >
      <!-- Google icon -->
      <svg width="18" height="18" viewBox="0 0 24 24" style="flex-shrink: 0;">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <span>繼續 · Continue with Google</span>
    </button>

    <!-- Bottom note -->
    <div style="margin-top: 32px; text-align: center;">
      <p style="
        font-size: 0.72rem; color: var(--text-faint-40);
        letter-spacing: 0.12em; line-height: 1.8; margin: 0;
      ">
        僅限核准的管理者<br>
        <span style="letter-spacing: 0.06em;">Restricted to approved curators</span>
      </p>
    </div>

    <!-- Bottom accent line -->
    <div style="
      position: absolute; bottom: 0; left: 56px; right: 56px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(124,108,242,0.25), transparent);
    "></div>

  </div>

  <!-- Bottom edition mark -->
  <div style="
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-size: 0.7rem; color: var(--text-faint-30); letter-spacing: 0.3em;
    text-transform: uppercase; white-space: nowrap;
  ">
    偶像成員記録 · Archive Edition
  </div>

</div>

    animation: fadeUpIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;

    box-shadow: 0 2px 8px rgba(232,121,160,0.08), 0 1px 2px rgba(45,27,46,0.04);
