<main style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 64px 24px;">
  <div style="text-align: center; max-width: 32rem;">
    <p style="font-size: 3.75rem; font-family: 'Shippori Mincho', serif; letter-spacing: 0.1em; color: var(--text-primary);">404</p>
    <h1 style="margin-top: 16px; font-size: 1.5rem; font-weight: 600; color: var(--text-heading);">找不到頁面</h1>
    <p style="margin-top: 12px; color: var(--text-secondary); line-height: 1.7; font-size: 0.9rem;">
      很抱歉，您要找的頁面不存在、已被移除或連結錯誤。
    </p>
    <div style="margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;">
      <a routerLink="/" style="
        display: inline-flex; align-items: center;
        padding: 13px 20px; border-radius: 6px;
        background: var(--text-primary); color: var(--bg-page);
        text-decoration: none; font-size: 0.85rem; letter-spacing: 0.04em;
        transition: opacity 0.2s;
      ">回首頁</a>
      <a routerLink="/members" style="
        display: inline-flex; align-items: center;
        padding: 13px 20px; border-radius: 6px;
        border: 1px solid var(--border-medium); color: var(--text-primary);
        text-decoration: none; font-size: 0.85rem; letter-spacing: 0.04em;
        transition: background 0.2s, border-color 0.2s;
      ">瀏覽成員</a>
      <a routerLink="/guide" style="
        display: inline-flex; align-items: center;
        padding: 13px 20px; border-radius: 6px;
        border: 1px solid var(--border-medium); color: var(--text-primary);
        text-decoration: none; font-size: 0.85rem; letter-spacing: 0.04em;
        transition: background 0.2s, border-color 0.2s;
      ">使用指南</a>
    </div>
  </div>
</main>
